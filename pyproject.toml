[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zgraph"
version = "0.1.1"
description = "Differentiable belief propagation and convex optimization via soft-tropical sum-product networks."
authors = [
  { name="Mike Welland", email="mike@mikewelland.com" }
]
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.9"
keywords = ["soft-tropical", "factor-graph", "sum-product-network", "belief-propagation", "convex-optimization", "input-convex-neural-networks", "legendre-fenchel", "jax"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax",
    "jaxlib",
    "equinox",
]

[project.urls]
Homepage = "https://github.com/themintlab/ZGraph"
Repository = "https://github.com/themintlab/ZGraph"
"Bug Tracker" = "https://github.com/themintlab/ZGraph/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["zgraph*"]
